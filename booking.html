<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a Service | TrustServe</title><link rel="stylesheet" href="assets/styles.css"><script defer src="assets/app.js"></script></head><body><div id="site-header"></div><main class="container">
<div class="page-title"><div class="eyebrow">Schedule a professional</div><h1>Book your service</h1><p>Share your requirements. Your booking will receive a demo confirmation.</p></div><form class="form-card" data-booking-form><div class="form-grid"><div><label>Customer name</label><input name="customer" placeholder="Priya Sharma" required></div><div><label>Service</label><select name="service"><option>AC Servicing</option><option>Plumbing</option><option>Electrical Repair</option><option>Deep Cleaning</option><option>Painting</option></select></div></div><label>Full service address</label><textarea name="address" placeholder="Flat, tower, society, city" required></textarea><label>Preferred date and time</label><input type="datetime-local" name="scheduledAt" required><label>Estimated amount (₹)</label><input name="amount" type="number" min="0" value="799" required><div class="notice">A final price is confirmed after professional inspection. This is an academic demo booking.</div><button type="submit">Confirm Booking →</button><p id="formMessage" class="muted"></p></form>
</main><div id="site-footer"></div></body></html>
